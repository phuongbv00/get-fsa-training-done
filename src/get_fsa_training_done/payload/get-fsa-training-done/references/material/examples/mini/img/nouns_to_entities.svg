<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 420" width="400" height="420" font-family="sans-serif">
  <!-- Drawn at the content-picture slot's shape (285 x 298 pt): text 18 or more. -->
  <rect x="0" y="0" width="400" height="420" rx="16" fill="#f2f5fa"/>
  <!-- The sentence, with its nouns and its verb marked. -->
  <rect x="16" y="28" width="368" height="64" rx="10" fill="#ffffff" stroke="#d3dbe8"/>
  <text x="34" y="68" font-size="20" fill="#1f2328">A</text>
  <rect x="54" y="42" width="92" height="36" rx="8" fill="#034ea1"/>
  <text x="100" y="67" font-size="20" fill="#ffffff" text-anchor="middle">member</text>
  <rect x="154" y="42" width="98" height="36" rx="8" fill="#50b748"/>
  <text x="203" y="67" font-size="20" fill="#ffffff" text-anchor="middle">borrows</text>
  <text x="268" y="68" font-size="20" fill="#1f2328" text-anchor="middle">a</text>
  <rect x="284" y="42" width="82" height="36" rx="8" fill="#034ea1"/>
  <text x="325" y="67" font-size="20" fill="#ffffff" text-anchor="middle">book</text>
  <!-- Arrows down to the entities, heads drawn as polygons. -->
  <line x1="100" y1="92" x2="72" y2="236" stroke="#034ea1" stroke-width="3"/>
  <polygon points="63,230 70,250 81,233" fill="#034ea1"/>
  <line x1="203" y1="92" x2="200" y2="236" stroke="#50b748" stroke-width="3"/>
  <polygon points="190,233 200,252 210,233" fill="#50b748"/>
  <line x1="325" y1="92" x2="328" y2="236" stroke="#034ea1" stroke-width="3"/>
  <polygon points="318,233 329,252 338,232" fill="#034ea1"/>
  <text x="212" y="170" font-size="18" fill="#2e7d32">hides</text>
  <text x="212" y="192" font-size="18" fill="#2e7d32">one</text>
  <!-- The entities. -->
  <rect x="16" y="254" width="116" height="66" rx="12" fill="#034ea1"/>
  <text x="74" y="294" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">MEMBER</text>
  <rect x="142" y="254" width="116" height="66" rx="12" fill="#50b748"/>
  <text x="200" y="294" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">LOAN</text>
  <rect x="268" y="254" width="116" height="66" rx="12" fill="#034ea1"/>
  <text x="326" y="294" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">BOOK</text>
  <text x="200" y="368" font-size="18" fill="#5b6370" text-anchor="middle">A noun with facts of its own</text>
  <text x="200" y="392" font-size="18" fill="#5b6370" text-anchor="middle">is an entity</text>
</svg>
