<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" width="600" height="420" font-family="sans-serif">
  <rect x="0" y="0" width="600" height="420" rx="16" fill="#f2f5fa"/>
  <!-- The sentence, with its nouns and its verb marked. -->
  <text x="300" y="44" font-size="17" fill="#5b6370" text-anchor="middle">Read the description, mark the nouns and the verb</text>
  <rect x="34" y="70" width="532" height="64" rx="10" fill="#ffffff" stroke="#d3dbe8"/>
  <text x="62" y="111" font-size="24" fill="#1f2328">A</text>
  <rect x="86" y="84" width="124" height="38" rx="8" fill="#034ea1"/>
  <text x="148" y="111" font-size="24" fill="#ffffff" text-anchor="middle">member</text>
  <rect x="222" y="84" width="128" height="38" rx="8" fill="#50b748"/>
  <text x="286" y="111" font-size="24" fill="#ffffff" text-anchor="middle">borrows</text>
  <text x="372" y="111" font-size="24" fill="#1f2328" text-anchor="middle">a</text>
  <rect x="394" y="84" width="96" height="38" rx="8" fill="#034ea1"/>
  <text x="442" y="111" font-size="24" fill="#ffffff" text-anchor="middle">book</text>
  <!-- Arrows down to the entities, heads drawn as polygons. -->
  <line x1="148" y1="134" x2="110" y2="250" stroke="#034ea1" stroke-width="3"/>
  <polygon points="102,244 110,262 119,246" fill="#034ea1"/>
  <line x1="286" y1="134" x2="300" y2="250" stroke="#50b748" stroke-width="3"/>
  <polygon points="291,246 301,262 309,245" fill="#50b748"/>
  <line x1="442" y1="134" x2="490" y2="250" stroke="#034ea1" stroke-width="3"/>
  <polygon points="481,248 493,262 497,243" fill="#034ea1"/>
  <text x="318" y="200" font-size="15" fill="#2e7d32">the verb hides one</text>
  <!-- The entities. -->
  <rect x="34" y="264" width="152" height="74" rx="12" fill="#034ea1"/>
  <text x="110" y="310" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">MEMBER</text>
  <rect x="224" y="264" width="152" height="74" rx="12" fill="#50b748"/>
  <text x="300" y="310" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">LOAN</text>
  <rect x="414" y="264" width="152" height="74" rx="12" fill="#034ea1"/>
  <text x="490" y="310" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">BOOK</text>
  <text x="300" y="384" font-size="16" fill="#5b6370" text-anchor="middle">Each noun with facts of its own is an entity, named in the singular</text>
</svg>
