[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "get-fsa-training-done"
dynamic = ["version"]
description = "One agent skill, and the CLI behind it, for getting FSA training done: programmes, teaching material and assessments. Installs into Claude Code, Codex and GitHub Copilot."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Phuong Bui" }]
keywords = ["assessment", "curriculum", "grading", "claude-code", "codex", "github-copilot", "agent-skill"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Education",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Education :: Testing",
]

# The package itself declares nothing, deliberately: `pip install
# get-fsa-training-done` pulls no transitive tree, and every lifecycle command
# (install, update, status, doctor) runs on a bare interpreter.
#
# The libraries the *workers* need live in the managed venv instead, listed in
# `envmgr/requirements/core.txt` and pre-warmed by `install`. So the offline
# guarantee still holds — after the first install, which needs a network.
dependencies = []

[project.urls]
Homepage = "https://github.com/phuongbv00/get-fsa-training-done"
Issues = "https://github.com/phuongbv00/get-fsa-training-done/issues"

[project.scripts]
get-fsa-training-done = "get_fsa_training_done.cli:run"
gftd = "get_fsa_training_done.cli:run"

[tool.hatch.version]
path = "src/get_fsa_training_done/__about__.py"

[tool.hatch.build.targets.wheel]
# The skill's payload is data inside this one package, so the default
# packages declaration already covers everything — no force-include needed.
packages = ["src/get_fsa_training_done"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/scripts",
  "/README.md",
  "/LICENSE",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
