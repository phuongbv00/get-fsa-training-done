name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write # PyPI Trusted Publishing — no long-lived token to leak

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: the tag must match the canonical version
        run: |
          set -euo pipefail
          version=$(python -c "import re,pathlib; \
            print(re.search(r'__version__ = \"([^\"]+)\"', \
            pathlib.Path('src/get_fsa_training_done/__about__.py').read_text()).group(1))")
          if [ "v$version" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match __about__.py ($version)"
            exit 1
          fi
      - run: python scripts/sync_version.py --check
      - run: |
          set -euo pipefail
          for generator in scripts/*/gen_*.py; do python "$generator" --check; done

  pypi:
    needs: guard
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - name: the wheel must contain every registered skill's payload
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib, sys, zipfile

          sys.path.insert(0, "src")
          from get_fsa_training_done import skills as skill_registry

          wheel = next(pathlib.Path("dist").glob("*.whl"))
          names = zipfile.ZipFile(wheel).namelist()

          required = [
              f"get_fsa_training_done/skills/{skill.namespace}/payload/{skill.name}/SKILL.md"
              for skill in skill_registry.all_skills()
          ]
          missing = [name for name in required if name not in names]
          if missing:
              raise SystemExit(f"wheel is missing package data: {missing}")
          print(f"{wheel.name}: {len(names)} files, {len(required)} skill payload(s) present")
          PY
      - uses: pypa/gh-action-pypi-publish@release/v1

  npm:
    needs: guard
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  github-release:
    needs: [pypi, npm]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: gh release create "${GITHUB_REF_NAME}" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
