name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write # PyPI Trusted Publishing — no long-lived token to leak

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: the tag must match the canonical version
        run: |
          set -euo pipefail
          version=$(python -c "import re,pathlib; \
            print(re.search(r'__version__ = \"([^\"]+)\"', \
            pathlib.Path('src/get_fsa_training_done/__about__.py').read_text()).group(1))")
          if [ "v$version" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match __about__.py ($version)"
            exit 1
          fi
      - run: python scripts/sync_version.py --check
      - run: |
          set -euo pipefail
          for generator in scripts/*/gen_*.py; do python "$generator" --check; done

  pypi:
    needs: guard
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - name: the wheel must contain the skill payload
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib, sys, zipfile

          sys.path.insert(0, "src")
          from get_fsa_training_done.skill import SKILL

          wheel = next(pathlib.Path("dist").glob("*.whl"))
          names = zipfile.ZipFile(wheel).namelist()

          required = [f"get_fsa_training_done/payload/{SKILL.name}/SKILL.md"]
          missing = [name for name in required if name not in names]
          if missing:
              raise SystemExit(f"wheel is missing package data: {missing}")
          print(f"{wheel.name}: {len(names)} files, skill payload present")
          PY
      - uses: pypa/gh-action-pypi-publish@release/v1

  npm:
    # Trusted publishing only: npm exchanges this job's OIDC token for a
    # one-off publish credential, so no npm token is stored anywhere. Set up
    # once on npmjs.com, under the package's Settings > Trusted publisher:
    # GitHub Actions, this repository, workflow `release.yml`, environment
    # `release`. A trusted publisher can only be added to a package that
    # exists, so the very first version is published by hand; this job then
    # sees it on the registry and skips rather than failing the release.
    needs: guard
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Trusted publishing needs npm 11.5.1+ on Node 22.14+.
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          # Never restore a cache into a publishing job.
          package-manager-cache: false
      # `prepack` stages the Python package into npm/python.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - id: published
        name: is this version already on the registry?
        run: |
          set -euo pipefail
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already published; skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.published.outputs.skip != 'true'
        run: npm publish --provenance --access public

  github-release:
    needs: [pypi, npm]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: gh release create "${GITHUB_REF_NAME}" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
