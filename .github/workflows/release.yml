name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write # PyPI Trusted Publishing — no long-lived token to leak

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: the tag must match the canonical version
        run: |
          set -euo pipefail
          version=$(python -c "import re,pathlib; \
            print(re.search(r'__version__ = \"([^\"]+)\"', \
            pathlib.Path('src/get_fsa_training_done/__about__.py').read_text()).group(1))")
          if [ "v$version" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match __about__.py ($version)"
            exit 1
          fi
      - run: python scripts/sync_version.py --check
      - run: |
          set -euo pipefail
          for generator in scripts/*/gen_*.py; do python "$generator" --check; done

  pypi:
    needs: guard
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - name: the wheel must contain the skill payload
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib, sys, zipfile

          sys.path.insert(0, "src")
          from get_fsa_training_done.skill import SKILL

          wheel = next(pathlib.Path("dist").glob("*.whl"))
          names = zipfile.ZipFile(wheel).namelist()

          required = [f"get_fsa_training_done/payload/{SKILL.name}/SKILL.md"]
          missing = [name for name in required if name not in names]
          if missing:
              raise SystemExit(f"wheel is missing package data: {missing}")
          print(f"{wheel.name}: {len(names)} files, skill payload present")
          PY
      - uses: pypa/gh-action-pypi-publish@release/v1

  npm:
    # Trusted publishing: npm exchanges this job's OIDC token for a one-off
    # publish credential, so no long-lived token is stored once the package is
    # set up on npmjs.com (Settings > Trusted publisher: this repository,
    # workflow `release.yml`, environment `release`). A package that does not
    # exist yet cannot have a trusted publisher, so the very first publish
    # uses the NPM_TOKEN secret instead; delete the secret after it.
    needs: guard
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Trusted publishing needs npm 11.5.1+ on Node 22.14+.
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      # `prepack` stages the Python package into npm/python.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm --version
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  github-release:
    needs: [pypi, npm]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: gh release create "${GITHUB_REF_NAME}" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
