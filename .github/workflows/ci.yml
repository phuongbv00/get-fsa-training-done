name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pipx install ruff
      - run: ruff check .
      - run: ruff format --check .

  consistency:
    # The version lives in several files, and each feature's generated references
    # live in two — one for the CLI to execute, one for the model to read.
    # Drift is invisible at runtime, so it fails the build instead.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python scripts/sync_version.py --check
      # Globbed, so a new generated reference is covered the day it lands.
      - run: |
          set -euo pipefail
          for generator in scripts/*/gen_*.py; do
            echo "== $generator"
            python "$generator" --check
          done

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e . pytest
      # The workers run in the managed venv; the tests run here, so they need
      # the same libraries to exercise the real renderer and archive readers.
      - run: pip install -r src/get_fsa_training_done/lifecycle/envmgr/requirements/core.txt
      - run: pytest -q

  install-round-trip:
    # Exercises the real lifecycle against a throwaway HOME, across every
    # platform, and asserts the tree is byte-clean afterwards.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: install, update, uninstall
        env:
          CLAUDE_CONFIG_DIR: ${{ runner.temp }}/home/.claude
          CODEX_HOME: ${{ runner.temp }}/home/.codex
          GET_FSA_TRAINING_DONE_HOME: ${{ runner.temp }}/home/cache
        run: |
          set -euo pipefail
          gftd install --platform all --dry-run
          gftd install --platform all
          gftd status --json
          gftd update --check
          gftd uninstall --platform all
          test -z "$(find "$CLAUDE_CONFIG_DIR" "$CODEX_HOME" -type f 2>/dev/null)" \
            || { echo "uninstall left files behind"; find "$CLAUDE_CONFIG_DIR" "$CODEX_HOME" -type f; exit 1; }
      - name: emit and verify against the shipped fixtures
        run: |
          set -euo pipefail
          gftd assessment emit blooket \
            --master tests/fixtures/assessment/question_set/quiz_master.csv -o /tmp/b.csv
          cmp /tmp/b.csv tests/fixtures/assessment/question_set/quiz_blooket.csv
          gftd assessment verify --type quiz \
            --master tests/fixtures/assessment/question_set/quiz_master.csv --blooket /tmp/b.csv

  render:
    # `render` needs no browser and no system fonts: it runs in the managed venv
    # and embeds its own faces. So this no longer skips itself when a runner
    # happens to lack Chrome — it must render, every time, on a bare machine.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: render the canonical brief and check its page budget
        run: |
          set -euo pipefail
          cp tests/fixtures/assessment/long_form/sbf_practice_exam_02.md /tmp/brief.md
          gftd assessment render /tmp/brief.md
      - name: a Vietnamese brief keeps its diacritics
        # The reason the fonts are embedded. Chrome used to resolve these from
        # the host, so this would have depended on the runner's font packages.
        run: |
          set -euo pipefail
          printf '# \u0110\u1ec1 b\u00e0i\n\nN\u1ed9p b\u00e0i d\u01b0\u1edbi d\u1ea1ng `m\u00e3_s\u1ed1.zip`.\n' > /tmp/vn.md
          gftd assessment render /tmp/vn.md --lang vi -o /tmp/vn.pdf
          pip install pypdf
          python -c 'from pypdf import PdfReader; t="\n".join(p.extract_text() for p in PdfReader("/tmp/vn.pdf").pages); assert all(f in t for f in ("\u0110\u1ec1 b\u00e0i","N\u1ed9p","m\u00e3_s\u1ed1")), t; assert "\x00" not in t, "missing glyph"; print("Vietnamese round-trip OK")'
