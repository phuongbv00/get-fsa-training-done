name: Trainer feedback
description: What works, what gets in the way, what is missing.
body:
  - type: dropdown
    id: feature
    attributes:
      label: Feature
      options:
        - Program (curriculum, syllabus, workbook)
        - Material (slides, lecture note, labs)
        - Assessment (quizzes, exams, grading)
        - Install
        - Other
    validations:
      required: false
  - type: dropdown
    id: agent
    attributes:
      label: Agent
      options:
        - Claude Code
        - Codex
        - GitHub Copilot
        - Antigravity
        - Other
    validations:
      required: false
  - type: textarea
    id: feedback
    attributes:
      label: Feedback
      description: What did you use it for, what worked, what did not?
    validations:
      required: true
